<!doctype html><html><head><meta charset="utf-8"><title>Blocks &amp; Ledgers</title><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { build } from './film.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;   // 1080×1920 with --size 1080x1920
const F = await build(cv.width, cv.height);
const ctx = cv.getContext('2d');
window.DUR = F.dur; window.EV = [...F.ev, { t: 0, type: 'cues', ...F.cues }]; window.TEXTS = F.texts;
window.render = t => F.render(ctx, t);
window.READY = true;
</script></body></html>
